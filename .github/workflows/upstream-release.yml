name: Upstream Release Watch

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  proton-rtsp:
    name: Proton-RTSP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: SpookySkeletons/proton-ge-rtsp
        run: |
          set -euo pipefail

          release_json="$(mktemp)"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
            > "${release_json}"

          current_version="$(sed -nE 's/^[[:space:]]*version = "([^"]+)";/\1/p' package.nix)"
          if [ -z "${current_version}" ]; then
            echo "Failed to read current version from package.nix" >&2
            exit 1
          fi

          latest_version="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["tag_name"])' "${release_json}"
          )"

          if [ "${latest_version}" = "${current_version}" ]; then
            echo "Already up to date: ${current_version}"
            exit 0
          fi

          release_name="$(
            python3 -c 'import json, sys; r = json.load(open(sys.argv[1], encoding="utf-8")); print(r.get("name") or r["tag_name"])' "${release_json}"
          )"

          release_url="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["html_url"])' "${release_json}"
          )"

          published_at="$(
            python3 -c 'import json, sys; r = json.load(open(sys.argv[1], encoding="utf-8")); print(r.get("published_at") or "unknown")' "${release_json}"
          )"

          asset_url="$(
            python3 -c 'import json, sys; r = json.load(open(sys.argv[1], encoding="utf-8")); print(next((a["browser_download_url"] for a in r.get("assets", []) if a.get("name", "").endswith(".tar.gz")), ""))' "${release_json}"
          )"

          issue_title="Update proton-ge-rtsp-bin to ${latest_version}"
          existing_issue="$(
            gh issue list \
              --state open \
              --search "${issue_title} in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${existing_issue}" ]; then
            echo "Issue #${existing_issue} already tracks ${latest_version}"
            exit 0
          fi

          {
            echo "Upstream Proton-RTSP has a new release."
            echo
            echo "- Current package: \`${current_version}\`"
            echo "- Latest upstream: \`${latest_version}\`"
            echo "- Release name: ${release_name}"
            echo "- Release URL: ${release_url}"
            echo "- Published at: ${published_at}"
            if [ -n "${asset_url}" ]; then
              echo "- Asset URL: ${asset_url}"
            fi
            echo
            echo "Suggested update:"
            echo
            echo "1. Set \`version = \"${latest_version}\";\` in \`package.nix\`."
            echo "2. Recompute \`fetchzip.hash\` for the release asset."
            echo "3. Verify with:"
            echo
            echo '```bash'
            echo "nix build .#proton-ge-rtsp-bin --no-link"
            echo "nix flake check"
            echo '```'
          } > issue.md

          gh issue create \
            --title "${issue_title}" \
            --body-file issue.md
